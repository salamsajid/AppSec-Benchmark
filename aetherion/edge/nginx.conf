worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 8m;

  log_format main '$remote_addr "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" cache=$upstream_cache_status';
  access_log /var/log/nginx/access.log main;

  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=app_cache:16m max_size=256m inactive=10m use_temp_path=off;

  upstream api_upstream {
    server api:3000;
    keepalive 24;
  }

  upstream idp_upstream {
    server idp:4000;
    keepalive 8;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Referrer-Policy "unsafe-url" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; img-src * data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src 'self' http://aetherion.local:8080; font-src 'self' data:;" always;

    location = /api/marketing/banner {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_cache app_cache;
      proxy_cache_key "$uri";
      proxy_cache_valid 200 120s;
      proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
      proxy_cache_lock off;
      proxy_cache_use_stale updating;
      add_header X-Cache-Status $upstream_cache_status always;
      add_header Referrer-Policy "unsafe-url" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Content-Security-Policy "default-src 'self'; img-src * data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src 'self' http://aetherion.local:8080; font-src 'self' data:;" always;
    }

    location ~* ^/api/.*\.(css|js|png|jpg|jpeg|gif|svg|woff2?)$ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_cache app_cache;
      proxy_cache_key "$uri";
      proxy_cache_valid 200 90s;
      proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
      proxy_cache_lock off;
      proxy_cache_use_stale updating;
      add_header X-Cache-Status $upstream_cache_status always;
      add_header Referrer-Policy "unsafe-url" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Content-Security-Policy "default-src 'self'; img-src * data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src 'self' http://aetherion.local:8080; font-src 'self' data:;" always;
    }

    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location /graphql {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 60s;
    }

    location /idp/ {
      proxy_pass http://idp_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 45s;
    }

    location /assets/ {
      try_files $uri =404;
      expires 1h;
      add_header Cache-Control "public";
      add_header Referrer-Policy "unsafe-url" always;
    }

    location /widget/ {
      try_files $uri =404;
      add_header Referrer-Policy "unsafe-url" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:;" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
