x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: astralane
      POSTGRES_USER: astralane
      POSTGRES_PASSWORD: astralane_lab_db_password
    volumes:
      - astralane_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astralane -d astralane"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  kafka:
    image: redpandadata/redpanda:latest
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://astralane:astralane_lab_db_password@db:5432/astralane
      REDIS_URL: redis://redis:6379
      PUBLIC_BASE: http://127.0.0.1:18080
      IDP_BASE: http://idp:4000
      IDP_PUBLIC_BASE: http://127.0.0.1:18080/idp
      IDP_CLIENT_ID: astralane-web
      IDP_CLIENT_SECRET: astralane_web_client_secret_2026
      SUBGRAPH_URL: http://subgraph:4001/graphql
      AUTHZ_URL: http://authz:4002
      PARTNER_TIMING_DELAY_MS: "26"
      CURSOR_KEY: 9f2c4e7a1b6d8f0a3c5e7b9d1f2a4c6e8b0d2f4a6c8e0b2d4f6a8c0e2b4d6f8a
      FLAG_ADMIN_VAULT: "ASTRA{ecdsa_biased_nonce_admin_6f2a}"
      FLAG_PARTNER: "ASTRA{http2_timing_hmac_secret_9d41}"
      FLAG_SAML: "ASTRA{saml_xsw_admin_3b7c}"
      FLAG_GRAPHQL: "ASTRA{graphql_cursor_padding_8e15}"
      FLAG_PAYOUT: "ASTRA{redos_failopen_payout_2c90}"
      FLAG_WALLET: "ASTRA{redis_lua_partial_commit_5a74}"
      FLAG_FEDERATION: "ASTRA{federation_entities_ssrf_c1e8}"
    volumes:
      - ./saml:/run/saml:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 4s
      retries: 16
      start_period: 30s
    logging: *default-logging

  idp:
    build:
      context: .
      dockerfile: idp/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgres://astralane:astralane_lab_db_password@db:5432/astralane
      IDP_PUBLIC_BASE: http://127.0.0.1:18080/idp
      APP_BASE: http://127.0.0.1:18080
      CLIENT_ID: astralane-web
      CLIENT_SECRET: astralane_web_client_secret_2026
      ACS_URL: http://127.0.0.1:18080/api/sso/saml/acs
      SAML_CERT_PATH: /run/saml/idp.crt
      SAML_KEY_PATH: /run/saml/idp.key
    volumes:
      - ./saml:/run/saml:ro
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 4s
      retries: 16
    logging: *default-logging

  authz:
    build:
      context: .
      dockerfile: authz/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4002"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 4s
      retries: 16
    logging: *default-logging

  subgraph:
    build:
      context: .
      dockerfile: subgraph/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4001"
      DATABASE_URL: postgres://astralane:astralane_lab_db_password@db:5432/astralane
      FLAG_FEDERATION: "ASTRA{federation_entities_ssrf_c1e8}"
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 4s
      retries: 16
    logging: *default-logging

  s3:
    build:
      context: .
      dockerfile: targets/s3/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/health || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 16
    logging: *default-logging

  targets:
    build:
      context: .
      dockerfile: targets/node/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8082"
      DATABASE_URL: postgres://astralane:astralane_lab_db_password@db:5432/astralane
      FLAG_DPOP: "ASTRA{dpop_jkt_replay_4f01}"
      FLAG_WEBAUTHN: "ASTRA{webauthn_cbor_duplicate_7b22}"
      FLAG_JSONB: "ASTRA{postgres_jsonb_collation_7e35}"
      FLAG_CHUNKED: "ASTRA{chunked_trailer_smuggle_9a3e}"
      FLAG_ESI: "ASTRA{esi_range_cache_6d58}"
      FLAG_MULTIPART: "ASTRA{multipart_boundary_s3_7c44}"
      FLAG_GRAMMAR: "ASTRA{llm_grammar_sqli_d0c4}"
      FLAG_ALS: "ASTRA{async_local_storage_leak_b692}"
      FLAG_ZK: "ASTRA{zk_underconstrained_witness_2d66}"
      FLAG_AGENT: "ASTRA{ai_memory_poison_9b4e}"
      FLAG_RSC: "ASTRA{rsc_flight_closure_4a8d}"
      S3_ENDPOINT: "http://s3:9000"
      S3_BUCKET: "uploads"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
    ports:
      - "127.0.0.1:18082:8082"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8082/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 4s
      retries: 16
      start_period: 20s
    logging: *default-logging

  targets-h2:
    build:
      context: .
      dockerfile: targets/h2/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8084"
      FLAG_CONNECT: "ASTRA{connect_tunnel_mesh_a8f2}"
      FLAG_GRPC: "ASTRA{grpc_trailer_status_b1f0}"
    ports:
      - "127.0.0.1:18084:8084"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('node:http2');const c=h.connect('http://127.0.0.1:8084');c.on('connect',()=>{c.close();process.exit(0)});c.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)\""]
      interval: 10s
      timeout: 4s
      retries: 16
    logging: *default-logging

  targets-turn:
    build:
      context: .
      dockerfile: targets/turn/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3478"
      ADMIN_PORT: "9091"
      FLAG_TURN: "ASTRA{turn_loopback_pivot_c7a1}"
    ports:
      - "127.0.0.1:18088:3478/tcp"
      - "127.0.0.1:18088:3478/udp"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const n=require('node:net');const s=n.connect(3478,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)\""]
      interval: 10s
      timeout: 4s
      retries: 16
    logging: *default-logging

  targets-java:
    build:
      context: .
      dockerfile: targets/java/Dockerfile
    restart: unless-stopped
    environment:
      FLAG_JAVA: "ASTRA{java_threadlocal_leak_9f61}"
    ports:
      - "127.0.0.1:18087:8087"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8087/health || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 16
    logging: *default-logging

  targets-qpack:
    build:
      context: .
      dockerfile: targets/qpack/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8086"
      FLAG_QPACK: "ASTRA{qpack_desync_header_5e17}"
    ports:
      - "127.0.0.1:18086:8086"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8086/health || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 16
    logging: *default-logging

  targets-go:
    build:
      context: .
      dockerfile: targets/go/Dockerfile
    restart: unless-stopped
    environment:
      FLAG_GO: "ASTRA{go_context_socket_reuse_4e2c}"
    ports:
      - "127.0.0.1:18085:8090"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/astralane-go", "-health"]
      interval: 10s
      timeout: 4s
      retries: 16
    logging: *default-logging

  targets-python:
    build:
      context: .
      dockerfile: targets/python/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8083"
      FLAG_PYTHON: "ASTRA{python_format_sandbox_d3b8}"
      FLAG_CHARSET: "ASTRA{charset_ebcdic_spel_c04b}"
    ports:
      - "127.0.0.1:18083:8083"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health', timeout=2).read()\""]
      interval: 10s
      timeout: 4s
      retries: 16
    logging: *default-logging

  targets-browser:
    build:
      context: .
      dockerfile: targets/browser/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8094"
      FLAG_OIDC: "ASTRA{oidc_logout_xsleak_1c93}"
      FLAG_WASM: "ASTRA{wasm_linear_heap_xss_4a19}"
      FLAG_SPECULATION: "ASTRA{speculation_cspt_8b73}"
      FLAG_IMPORTMAP: "ASTRA{importmap_clobber_2e50}"
      FLAG_SHADOWDOM: "ASTRA{shadowdom_css_keylogger_5b38}"
      FLAG_SHAREDSTORAGE: "ASTRA{sharedstorage_windowname_1d9e}"
    ports:
      - "127.0.0.1:18094:8094"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8094/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 4s
      retries: 20
      start_period: 20s
    logging: *default-logging

  targets-webtransport:
    build:
      context: .
      dockerfile: targets/webtransport/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8096"
      HEALTH_PORT: "8097"
      BRIDGE_PORT: "8098"
      FLAG_WEBTRANSPORT: "ASTRA{webtransport_datagram_e93a}"
    ports:
      - "127.0.0.1:18096:8096/udp"
      - "127.0.0.1:18097:8097"
      - "127.0.0.1:18098:8098"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8097/health', timeout=2).read()\""]
      interval: 10s
      timeout: 4s
      retries: 20
    logging: *default-logging

  targets-kafka:
    build:
      context: .
      dockerfile: targets/kafka/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8091"
      FLAG_KAFKA: "ASTRA{kafka_dlq_deserialization_8c13}"
      KAFKA_BROKER: "kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:18091:8091"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=2).read()\""]
      interval: 10s
      timeout: 4s
      retries: 20
    logging: *default-logging

  targets-wasi:
    build:
      context: .
      dockerfile: targets/wasi/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8090"
      FLAG_WASI: "ASTRA{wasi_fd_confusion_6a07}"
    ports:
      - "127.0.0.1:18090:8090"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8090/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 4s
      retries: 16
    logging: *default-logging

  lab:
    build:
      context: .
      dockerfile: lab/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8081"
      LAB_TOKEN: astra_lab_token_9f3c2a
      FLAGS_PATH: /app/shared/flags.json
    ports:
      - "127.0.0.1:18081:8081"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8081/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 4s
      retries: 16
    logging: *default-logging

  edge:
    build:
      context: .
      dockerfile: edge/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./edge/site:/usr/share/nginx/html:ro
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      idp:
        condition: service_healthy
      targets:
        condition: service_healthy
      targets-python:
        condition: service_healthy
      targets-wasi:
        condition: service_healthy
      targets-kafka:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 16
    logging: *default-logging

volumes:
  astralane_db:
