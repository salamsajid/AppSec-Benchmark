# INTENTIONALLY VULNERABLE NGINX CONFIG - LAB ONLY
# Demonstrates: Host header forwarding, cache key flaws, HTTP/2 + HTTP/1.1 mixed parsers.
# Phase 4 targets: CL.TE / TE.CL, H2.TE, H2.CL, response queue poisoning, cache poisoning/deception.
user nginx;
worker_processes 1;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  # --- VULN: cache key ignores critical context (Phase 4 / cache poisoning) ---
  # Only $uri is keyed. Cookies, Host, User-Agent, X-Forwarded-Host are unkeyed.
  proxy_cache_path /tmp/uvp-cache keys_zone=uvp:10m max_size=100m inactive=60m use_temp_path=off;
  upstream iam_backend { server iam:8000; }
  upstream catalog_backend { server catalog:3000; }
  upstream lead_backend { server lead:5000; }
  upstream lead_ws { server lead:5001; }
  upstream serialization_backend { server serialization-lab:8000; }
  upstream smuggle_backend { server smuggle-lab:8081; }
  upstream frontend_backend { server frontend:3001; }
  upstream spa_backend { server spa:80; }
  upstream ai_backend { server ai-assistant:6000; }
  upstream oob_backend { server oob-collaborator:9000; }
  upstream fleet_ops_backend { server fleet-ops:7000; }

  # Intentionally permissive: large headers, merge_slashes, ignore_invalid_headers off
  # to allow smuggling / splitting experiments in Phase 4.
  # VULN: underscores + unvalidated headers allow obfuscated TE (Transfer_Encoding, X-Transfer-Encoding)
  ignore_invalid_headers off;
  underscores_in_headers on;
  merge_slashes on;
  # VULN: request buffering off enables pause-based desync + queue poisoning timing
  proxy_request_buffering off;
  client_max_body_size 50m;
  client_header_buffer_size 16k;
  large_client_header_buffers 8 32k;
  # VULN: keepalive + pipelining left on for response queue poisoning / client-side desync
  keepalive_timeout 65;
  client_body_timeout 30;

  server {
    listen 8080;
    # Phase 4: dual H1/H2 front-end. Back-ends stay H1 -> H2.TE / H2.CL / tunnelling surface.
    # VULN: H2 downgrade confusion + CRLF allowed in H2 headers (injection lab).
    listen 8443 ssl http2;
    ssl_certificate /etc/nginx/cert.pem;
    ssl_certificate_key /etc/nginx/key.pem;
    # VULN: ambiguous parsing - unescaped pseudo-headers forwarded as H1 headers

    # VULN: trust X-Forwarded-Host / X-Forwarded-For for password-reset poisoning
    # and brute-force IP-block bypass. Forwarded unvalidated.
    # VULN: ambiguous request parsing left in for routing-based SSRF labs.

    location /api/iam/ {
      proxy_pass http://iam_backend/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # Preserve attacker Host + forwarded headers (intentional for Host attacks)
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Original-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      # VULN: cache GETs with unkeyed headers/cookies -> poisoning / deception
      proxy_cache uvp;
      proxy_cache_methods GET HEAD;
      proxy_cache_key $uri$is_args$args;
      proxy_cache_valid 200 60s;
      add_header X-Cache-Status $upstream_cache_status always;
      # VULN: allow Fat GET with body (for cache-poisoning Fat-GET lab)
      # VULN: no request-size / TE validation -> CL.TE / TE.CL in Phase 4
    }

    location /api/catalog/ {
      proxy_pass http://catalog_backend/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_cache uvp;
      proxy_cache_methods GET HEAD;
      proxy_cache_key $uri$is_args$args;
      proxy_cache_valid 200 60s;
      add_header X-Cache-Status $upstream_cache_status always;

      # storefront search pages cache longer (product policy); poisoning
      # any unkeyed input here persists across the benchmark window
      location = /api/catalog/v1/vehicles/search {
        proxy_pass http://catalog_backend/v1/vehicles/search;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache uvp;
        proxy_cache_methods GET HEAD;
        proxy_cache_key $uri$is_args$args;
        proxy_cache_valid 200 1800s;
        add_header X-Cache-Status $upstream_cache_status always;
      }
    }

    location /api/lead/ws/ {
      proxy_pass http://lead_ws/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      # VULN: no Origin validation -> CSWSH; forwards cookies for hijack
      proxy_set_header Cookie $http_cookie;
      proxy_read_timeout 86400;
    }

    location /api/lead/ {
      proxy_pass http://lead_backend/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # VULN: gateway forwards ALL duplicate params as comma-joined string;
      # Flask's getlist() splits them, qs extended parser keeps array -> divergence
      # (used by HPP embargo bypass and inventory status labs)
      proxy_cache uvp;
      proxy_cache_methods GET HEAD;
      proxy_cache_key $uri$is_args$args;
      proxy_cache_valid 200 60s;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    location /api/fleet/ {
      proxy_pass http://fleet_ops_backend/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # no caching: diagnostics are sensitive per-request
    }

    location /api/ser/ {
      proxy_pass http://serialization_backend/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      client_max_body_size 20m;
    }

    location /api/smuggle/ {
      proxy_pass http://smuggle_backend/;
      proxy_http_version 1.1;
      # VULN: forward ambiguous TE/CL unnormalized for CL.TE / TE.CL / 0.CL / CL.0 / obfuscated-TE
      # NOTE: proxies to / root so /api/smuggle/smuggle/parse -> /smuggle/parse,
      # /api/smuggle/cache/reflect -> /cache/reflect, /api/smuggle/host/reset -> /host/reset.
      proxy_set_header Transfer-Encoding $http_transfer_encoding;
      proxy_set_header X-Transfer-Encoding $http_x_transfer_encoding;
      proxy_set_header Content-Length $http_content_length;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      proxy_set_header Connection "";
      proxy_request_buffering off;
      proxy_read_timeout 30;
    }

    # Aliases: /api/cache/* -> /cache/*, /api/host/* -> /host/* (same backend)
    location /api/cache/ {
      proxy_pass http://smuggle_backend/cache/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header User-Agent $http_user_agent;
      # VULN: flawed cache key - ignores Host/Cookie/UA/XFH/body (poisoning) + Fat GET cached
      proxy_cache uvp;
      proxy_cache_methods GET HEAD;
      proxy_cache_key $uri$is_args$args;
      proxy_cache_valid 200 60s;
      proxy_ignore_headers Cache-Control Expires Set-Cookie;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    location /api/host/ {
      proxy_pass http://smuggle_backend/host/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      proxy_set_header X-Original-Host $host;
    }

    location /api/fleet-ops/ {
      proxy_pass http://fleet_ops_backend/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/web/ {
      proxy_pass http://frontend_backend/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_cache uvp;
      proxy_cache_methods GET HEAD;
      proxy_cache_key $uri$is_args$args;
      proxy_cache_valid 200 30s;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    location /api/frontend/ {
      proxy_pass http://frontend_backend/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
    }

    location /api/ai/ {
      proxy_pass http://ai_backend/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      proxy_read_timeout 30;
    }

    location /oob/ {
      proxy_pass http://oob_backend/;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://spa_backend/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    }
  }
}
